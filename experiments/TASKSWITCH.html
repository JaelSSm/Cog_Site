<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title> Task Switching Paradigma (TS) </title>

        <script src="https://unpkg.com/jspsych@8.2.3"></script>
        <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
        <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" />
        <script src="ce-duration.js"></script>
        <script src="ce-chart.js"></script>

        <style>

            /* jsPsych v8: .jspsych-content collapses to zero WIDTH inside the
               flex wrapper. Give it explicit width and centre it. */
            html, body { min-height: 100vh; margin: 0; }
            .jspsych-display-element { width: 100%; min-height: 100vh; }
            .jspsych-content-wrapper { width: 100%; }
            .jspsych-content { width: 100%; max-width: 900px; margin: auto; }

            /* Bilingual: hide the inactive language */
            [lang="hu"] .en { display: none; }
            [lang="en"] .hu { display: none; }

            /* Page theme matching the rest of the site */
            body {
            background: #FBF7EE;
            color: #1F1B16;
            font-family: "Public Sans", system-ui, sans-serif;
            }
            @media (prefers-color-scheme: dark) {
            body { background: #181612; color: #E8E3D6; }
            }

            /* Stimulus rendering */
            .fixation { font-size: 60px; }

            /* Coloured cue background behind the digit */
            .ts-frame {
                width: 220px;
                height: 220px;
                border-radius: 12px;
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 0 auto;
            }
            .ts-frame.parity    { background: #F4D03F; }  /* yellow — odd/even   */
            .ts-frame.magnitude { background: #5DADE2; }  /* blue   — </> than 5 */
            .ts-digit {
                font-size: 120px;
                font-weight: 600;
                color: #1F1B16;
                font-family: "DejaVu Sans Mono", "Menlo", monospace;
                line-height: 1;
            }

            /* Instruction screens */
            .instr {
                max-width: 620px;
                margin: 0 auto;
                text-align: left;
                line-height: 1.6;
                font-size: 17px;
            }
            .instr h2 {
                font-family: "Cormorant Garamond", Georgia, serif;
                font-size: 28px;
                font-weight: 600;
                margin: 0 0 1.1rem;
                text-align: center;
            }
            .instr p { margin: 0 0 1rem; }
            .instr .lead { margin-bottom: 1.4rem; }
            .instr .go { text-align: center; font-size: 14.5px; opacity: 0.68; margin: 1.4rem 0 0; }

            kbd {
                font-family: inherit;
                font-size: 0.92em;
                font-weight: 600;
                padding: 0.12em 0.5em;
                border: 1px solid rgba(31,27,22,0.28);
                border-bottom-width: 2px;
                border-radius: 5px;
                background: rgba(31,27,22,0.05);
                white-space: nowrap;
            }
            @media (prefers-color-scheme: dark) {
                kbd { border-color: rgba(232,227,214,0.30); background: rgba(232,227,214,0.07); }
            }

            /* One task rule: colour name, the rule, and two worked examples */
            .rule { margin: 0 0 1.4rem; }
            .rule p { margin: 0 0 0.6rem; }
            .ex-label { font-size: 14.5px; opacity: 0.7; margin: 0 0 0.35rem; }
            .ex-line {
                display: flex;
                align-items: center;
                gap: 1rem;
                margin: 0 0 0.3rem;
                font-size: 16px;
            }
            /* The example digit carries its own task colour, so the mapping from
               colour to rule is visible rather than only stated. */
            .ts-chip {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 30px; height: 30px;
                border-radius: 5px;
                flex: none;
                font-family: "DejaVu Sans Mono", "Menlo", monospace;
                font-size: 18px;
                font-weight: 600;
                color: #1F1B16;
            }
            .ts-chip.parity    { background: #F4D03F; }
            .ts-chip.magnitude { background: #5DADE2; }

            .debrief-table { margin: 1.5rem auto; border-collapse: collapse; font-size: 18px; }
            .debrief-table td { padding: 6px 18px; border-bottom: 1px solid rgba(0,0,0,0.12); text-align: left; }
            .debrief-table td:last-child { text-align: right; font-weight: 600; }
        </style>
    </head>
    <body>
        <script>

            /* restore saved language */
            try {
                const savedLang = localStorage.getItem('ce.lang');
                document.documentElement.lang = (savedLang === 'hu' || savedLang === 'en') ? savedLang : 'hu';
            } catch (e) { document.documentElement.lang = 'hu'; }

/* cog_site build 2026-09-02-a — TASKSWITCH */
/*
console.log('[cog_site] TASKSWITCH build 2026-09-02-a');
*/

/* Stop SPACE and the arrow keys from scrolling the page mid-trial.
   preventDefault only — jsPsych's own listener still receives the event. */
window.addEventListener('keydown', function (e) {
    if ([' ', 'Spacebar', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) !== -1) {
        e.preventDefault();
    }
}, { passive: false });


            // resp keys
            const KEY_LEFT  = 'arrowleft';
            const KEY_RIGHT = 'arrowright';

            // stimuli
            const DIGITS = [1, 2, 3, 4, 6, 7, 8, 9];
            const TASKS  = ['parity', 'magnitude'];


            function correctKey(digit, task) {
                if (task === 'parity') {
                    return (digit % 2 === 0) ? KEY_LEFT : KEY_RIGHT;   // even=left, odd=right
                } else {
                    return (digit < 5) ? KEY_LEFT : KEY_RIGHT;         // <5=left, >5=right
                }
            }

            // building the trial list(s)
            function buildTrialList(n) {
                const list = [];
                for (let i = 0; i < n; i++) {
                    const digit = jsPsych.randomization.sampleWithReplacement(DIGITS, 1)[0];
                    const task  = jsPsych.randomization.sampleWithReplacement(TASKS, 1)[0];
                    list.push({ digit: digit, ts_task: task, block_type: 'mixed' });
                }
                return list;
            }

            // single task block
            function buildSingleTaskList(n, task) {
                const list = [];
                for (let i = 0; i < n; i++) {
                    const digit = jsPsych.randomization.sampleWithReplacement(DIGITS, 1)[0];
                    list.push({ digit: digit, ts_task: task, block_type: 'pure' });
                }
                return list;
            }

            // innitialze the experiment
            const jsPsych = initJsPsych();

            const timeline = [];

            // state tracker for task-switch detection (mutable, lives outside the timeline)
            let previousTask = null;

            /* jsPsych v8 evaluates `data` BEFORE on_start runs, so writing to
               trial.data inside on_start is silently discarded. These module-level
               vars are the snapshot bridge from on_start into on_finish. */
            let pendingBlockType = 'mixed';
            let pendingTransition = 'first';


            /* instruction building blocks
               The two rules are written once and reused on every screen that
               needs them: opening instructions, the mixed-block intro, and every
               between-block break. */

            const RULE_PARITY = `
            <div class="rule">
                <p>
                    <span class="hu"><strong>Sárga</strong> háttér: paritás &ndash; <strong>páros</strong> szám esetén a
                        <strong>bal</strong> (&larr;), <strong>páratlan</strong> szám esetén a <strong>jobb</strong> (&rarr;)
                        nyilat nyomja le minél gyorsabban!</span>
                    <span class="en"><strong>Yellow</strong> background: parity &ndash; for an <strong>even</strong> number press
                        <strong>left</strong> (&larr;), for an <strong>odd</strong> number press <strong>right</strong> (&rarr;),
                        as quickly as you can!</span>
                </p>
                <p class="ex-label"><span class="hu">Példa:</span><span class="en">Example:</span></p>
                <div class="ex-line">
                    <span class="ts-chip parity">1</span>
                    <span><span class="hu">jobb nyíl (&rarr;)</span><span class="en">right arrow (&rarr;)</span></span>
                </div>
                <div class="ex-line">
                    <span class="ts-chip parity">8</span>
                    <span><span class="hu">bal nyíl (&larr;)</span><span class="en">left arrow (&larr;)</span></span>
                </div>
            </div>`;

            const RULE_MAGNITUDE = `
            <div class="rule">
                <p>
                    <span class="hu"><strong>Kék</strong> háttér: nagyság &ndash; ha a szám <strong>5-nél kisebb</strong>, a
                        <strong>bal</strong> (&larr;), ha <strong>5-nél nagyobb</strong>, a <strong>jobb</strong> (&rarr;)
                        nyilat nyomja le minél gyorsabban!</span>
                    <span class="en"><strong>Blue</strong> background: magnitude &ndash; if the number is <strong>less than 5</strong> press
                        <strong>left</strong> (&larr;), if it is <strong>greater than 5</strong> press <strong>right</strong> (&rarr;),
                        as quickly as you can!</span>
                </p>
                <p class="ex-label"><span class="hu">Példa:</span><span class="en">Example:</span></p>
                <div class="ex-line">
                    <span class="ts-chip magnitude">1</span>
                    <span><span class="hu">bal nyíl (&larr;)</span><span class="en">left arrow (&larr;)</span></span>
                </div>
                <div class="ex-line">
                    <span class="ts-chip magnitude">8</span>
                    <span><span class="hu">jobb nyíl (&rarr;)</span><span class="en">right arrow (&rarr;)</span></span>
                </div>
            </div>`;

            const BOTH_RULES = RULE_PARITY + RULE_MAGNITUDE;

            const START_LINE = `
            <p class="go">
                <span class="hu">A <kbd>SPACE</kbd> gombbal kezdhet.</span>
                <span class="en">Press <kbd>SPACE</kbd> to start.</span>
            </p>`;

            const CONTINUE_LINE = `
            <p class="go">
                <span class="hu">A <kbd>SPACE</kbd> gombbal folytathatja.</span>
                <span class="en">Press <kbd>SPACE</kbd> to continue.</span>
            </p>`;


            // instructions
            var instructions = {
                type : jsPsychHtmlKeyboardResponse,
                choices : [' '],
                stimulus : `
                    <div class="instr">
                        <p class="lead">
                            <span class="hu">A képernyő közepén egy számjegy jelenik meg színes háttéren, amivel kapcsolatban
                                két feladat lesz. Az első két blokkban egyféle feladatot kell végrehajtani, a további
                                blokkokban pedig ezek vegyesen szerepelnek. A feladatot a háttér színe jelzi.</span>
                            <span class="en">A digit appears in the middle of the screen on a coloured background, and there are
                                two tasks connected to it. In the first two blocks you do one task at a time; in the later
                                blocks the two are mixed. The background colour tells you which task to do.</span>
                        </p>
                        ${BOTH_RULES}
                        ${START_LINE}
                    </div>
                `,
                post_trial_gap : 2000
            };
            timeline.push(instructions);
            //

            // trial component(s)
            const fixation = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '<div class="fixation">+</div>',
                choices: "NO_KEYS",
                trial_duration: function(){
                    return jsPsych.randomization.sampleWithoutReplacement([500, 750, 1000], 1)[0];
                },
                data: {task:'fixation'}
            };

            // test cmoponent
            const test = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: function () {
                    const digit = jsPsych.evaluateTimelineVariable('digit');
                    const task  = jsPsych.evaluateTimelineVariable('ts_task');
                    return `<div class="ts-frame ${task}"><span class="ts-digit">${digit}</span></div>`;
                },
                choices: [KEY_LEFT, KEY_RIGHT],
                trial_duration: 2500,
                data: {
                    task:       'response',
                    digit:      jsPsych.timelineVariable('digit'),
                    ts_task:    jsPsych.timelineVariable('ts_task')
                },
                //
                on_start: function () {
                    const blockType = jsPsych.evaluateTimelineVariable('block_type') || 'mixed';
                    const thisTask  = jsPsych.evaluateTimelineVariable('ts_task');
                    pendingBlockType = blockType;
                    if (blockType === 'pure') {
                        pendingTransition = 'pure';
                    } else {
                        pendingTransition =
                              (previousTask === null)   ? 'first'
                            : (thisTask === previousTask) ? 'repeat'
                            :                               'switch';
                    }
                },
                on_finish: function (data) {
                    // carry the snapshot into the saved data
                    data.block_type = pendingBlockType;
                    data.transition = pendingTransition;

                    const expected = correctKey(data.digit, data.ts_task);
                    data.correct = jsPsych.pluginAPI.compareKeys(data.response, expected);
                    // only track previous task across mixed trials
                    previousTask = (data.block_type === 'mixed') ? data.ts_task : null;
                }
            };

            // making blocks
            function makeBlock(n) {
                return {
                    timeline: [fixation, test],
                    timeline_variables: buildTrialList(n)
                };
            }

            function makePureBlock(n, task) {
                return {
                    timeline: [fixation, test],
                    timeline_variables: buildSingleTaskList(n, task)
                };
            }

            /* Pure-block screen: names the colour and the decision for THIS task
               only, then repeats that one rule with its examples. */
            function pureBlockInst(task) {
                const isParity = (task === 'parity');
                const lead = isParity
                    ? `<span class="hu">Most csak egyféle feladat következik. A képernyő közepén egy számjegy jelenik meg
                          <strong>sárga</strong> háttéren, amivel kapcsolatban el kell döntenie, hogy páros, vagy páratlan.</span>
                       <span class="en">Now only one task follows. A digit appears in the middle of the screen on a
                          <strong>yellow</strong> background, and you decide whether it is even or odd.</span>`
                    : `<span class="hu">Most csak egyféle feladat következik. A képernyő közepén egy számjegy jelenik meg
                          <strong>kék</strong> háttéren, amivel kapcsolatban el kell döntenie, hogy kisebb, vagy nagyobb 5-nél.</span>
                       <span class="en">Now only one task follows. A digit appears in the middle of the screen on a
                          <strong>blue</strong> background, and you decide whether it is less than or greater than 5.</span>`;

                return {
                    type: jsPsychHtmlKeyboardResponse,
                    choices: [' '],
                    stimulus: `
                    <div class="instr">
                        <p class="lead">${lead}</p>
                        ${isParity ? RULE_PARITY : RULE_MAGNITUDE}
                        ${START_LINE}
                    </div>`,
                    post_trial_gap: 800
                };
            }

            /* Break screen: restates both rules in full. By this point in the
               session the colour-to-task mapping is easy to lose, and the
               participant has not seen enough trials for it to be automatic. */
            function betweenBlockInst(blockNum) {
                return {
                    type: jsPsychHtmlKeyboardResponse,
                    choices: [' '],
                    stimulus: `
                    <div class="instr">
                        <p>
                            <span class="hu">A(z) ${blockNum}. blokk vége. Pihenjen, ameddig szeretne.</span>
                            <span class="en">End of block ${blockNum}. Take a break for as long as you like.</span>
                        </p>
                        <p class="lead">
                            <span class="hu"><strong>A feladat változatlan:</strong> a képernyő közepén egy számjegy jelenik meg
                                színes háttéren, amivel kapcsolatban két feladat lesz.</span>
                            <span class="en"><strong>The task is unchanged:</strong> a digit appears in the middle of the screen
                                on a coloured background, with two tasks connected to it.</span>
                        </p>
                        ${BOTH_RULES}
                        ${CONTINUE_LINE}
                    </div>`,
                    post_trial_gap: 800
                };
            }

            // Mixed block = 12 trials, ~2.45s/trial => ~29s per block
            // blocks (~10 trials each) add ~1 min.
            // Short ~3min, Medium ~5min, Long ~10min
            const REPS = 12;                                        // trials per mixed block
            const PURE_REPS = 10;                                   // trials per pure baseline block
            const LENGTHS = { short: 5, medium: 9, long: 19 };      // mixed blocks per duration

            /* The opening text says the first two blocks are single-task, so the
               mixed blocks are numbered from 3 onwards. Set to 0 to number the
               mixed blocks 1..N instead. */
            const BLOCK_NUMBER_OFFSET = 2;

            ceChooseDuration().then(function (choice) {
                const N_BLOCKS = LENGTHS[choice];

                // pure single-task baseline blocks (order randomised)
                const pureOrder = jsPsych.randomization.shuffle(['parity', 'magnitude']);
                pureOrder.forEach(function (task) {
                    timeline.push(pureBlockInst(task));
                    timeline.push(makePureBlock(PURE_REPS, task));
                });

                // mixed task-switching blocks
                timeline.push({
                    type: jsPsychHtmlKeyboardResponse,
                    choices: [' '],
                    stimulus: `
                    <div class="instr">
                        <p class="lead">
                            <span class="hu">Mostantól a két feladat <strong>váltakozni</strong> fog a háttérszín szerint.
                                Figyelje a színt minden próbánál!</span>
                            <span class="en">From now on the two tasks will <strong>alternate</strong> according to the background
                                colour. Check the colour on every trial!</span>
                        </p>
                        ${BOTH_RULES}
                        ${START_LINE}
                    </div>`,
                    post_trial_gap: 800
                });
                for (let b = 1; b <= N_BLOCKS; b++) {
                    timeline.push(makeBlock(REPS));
                    if (b < N_BLOCKS) timeline.push(betweenBlockInst(b + BLOCK_NUMBER_OFFSET));
                }

                // "debriefing" == charted result screening
                timeline.push(ceResultsScreen(jsPsych, {
                    compute: function (jp) {
                        const en = (document.documentElement.lang === 'en');
                        const trials   = jp.data.get().filter({ task: 'response' });
                        const answered = trials.filterCustom(function (t) { return t.rt !== null; });
                        const correct  = trials.filter({ correct: true });
                        const wrong    = answered.count() - correct.count();
                        const missed   = trials.count() - answered.count();

                        const rtPure   = Math.round(correct.filter({ transition: 'pure'   }).select('rt').mean()) || 0;
                        const rtRepeat = Math.round(correct.filter({ transition: 'repeat' }).select('rt').mean()) || 0;
                        const rtSwitch = Math.round(correct.filter({ transition: 'switch' }).select('rt').mean()) || 0;

                    const rows = [
                        { label_hu: 'Helyes válaszok', label_en: 'Correct responses',   value: correct.count() },
                        { label_hu: 'Hibás válaszok',  label_en: 'Incorrect responses', value: wrong }
                    ];
                    if (missed > 0) {
                        rows.push({ label_hu: 'Nem válaszolt', label_en: 'No response', value: missed });
                    }
                        rows.push({ label_hu: 'Átlagos reakcióidő', label_en: 'Mean reaction time',
                                    value: (Math.round(correct.select('rt').mean()) || 0) + ' ms' });
                        rows.push({ label_hu: 'Reakcióidő — tiszta blokk',     label_en: 'RT — pure block',      value: rtPure + ' ms' });
                        rows.push({ label_hu: 'Reakcióidő — ismétlés',         label_en: 'RT — repeat',          value: rtRepeat + ' ms' });
                        rows.push({ label_hu: 'Reakcióidő — váltás',           label_en: 'RT — switch',          value: rtSwitch + ' ms' });

                        return {
                            rows: rows,
                            chart: {
                                kind: 'bar',
                                title: en ? 'Reaction time by trial type' : 'Reakcióidő próbatípusonként',
                                bars: [
                                    { label: en ? 'Pure'   : 'Tiszta',   value: rtPure,   unit: 'ms' },
                                    { label: en ? 'Repeat' : 'Ismétlés', value: rtRepeat, unit: 'ms' },
                                    { label: en ? 'Switch' : 'Váltás',   value: rtSwitch, unit: 'ms' }
                                ]
                            }
                        };
                    }
                }));

                jsPsych.run(timeline);
            });

        </script>
    </body>
</html>
