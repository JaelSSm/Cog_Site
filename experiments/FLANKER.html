<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Flanker Paradigma (FLK) </title>
        <script src="https://unpkg.com/jspsych@8.2.3"></script>
        <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
        <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" />
        <script src="ce-duration.js"></script>
        <script src="ce-chart.js"></script>
        <script src="ce-exit.js"></script>

        <style>

            /* jsPsych v8: .jspsych-content collapses to zero WIDTH inside the
               flex wrapper. Give it explicit width and centre it. */
            html, body { min-height: 100vh; margin: 0; }
            .jspsych-display-element { width: 100%; min-height: 100vh; }
            .jspsych-content-wrapper { width: 100%; }
            .jspsych-content { width: 100%; max-width: 900px; margin: auto; }

            /* Bilingual: hide the inactive language */
            [lang="hu"] .en { display: none; }
            [lang="en"] .hu { display: none; }

            /* Page theme matching the rest of the site */
            body {
            background: #FBF7EE;
            color: #1F1B16;
            font-family: "Public Sans", system-ui, sans-serif;
            }
            @media (prefers-color-scheme: dark) {
            body { background: #181612; color: #E8E3D6; }
            }

            /* Stimulus rendering */
            /* Arrows are drawn as SVG rather than typed as ← →, so the head can
               be made heavy relative to the shaft and the gap can be controlled
               directly instead of through letter-spacing. */
            .flanker-row {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 14px;                 /* was ~0.25em letter-spacing + &nbsp; */
            }
            .fl-arrow { display: block; width: 76px; height: 44px; }

            .fixation { font-size: 60px; }

            /* Instruction screens */
            .instr {
                max-width: 620px;
                margin: 0 auto;
                text-align: left;
                line-height: 1.6;
                font-size: 17px;
            }
            .instr h2 {
                font-family: "Cormorant Garamond", Georgia, serif;
                font-size: 28px;
                font-weight: 600;
                margin: 0 0 1.1rem;
                text-align: center;
            }
            .instr p { margin: 0 0 1rem; }
            .instr .hint { font-size: 14.5px; opacity: 0.68; }
            .instr .go { text-align: center; font-size: 14.5px; opacity: 0.68; margin-bottom: 0; }

            kbd {
                font-family: inherit;
                font-size: 0.92em;
                font-weight: 600;
                padding: 0.12em 0.5em;
                border: 1px solid rgba(31,27,22,0.28);
                border-bottom-width: 2px;
                border-radius: 5px;
                background: rgba(31,27,22,0.05);
                white-space: nowrap;
            }
            @media (prefers-color-scheme: dark) {
                kbd { border-color: rgba(232,227,214,0.30); background: rgba(232,227,214,0.07); }
            }

            /* Sample sequence + worked examples */
            .seq {
                display: flex;
                align-items: flex-start;
                justify-content: center;
                gap: 10px;
                margin: 0 auto 1.3rem;
                flex-wrap: wrap;
            }
            .seq-step { width: 190px; }
            .seq-box {
                display: flex; align-items: center; justify-content: center;
                width: 190px; height: 74px;
                border: 1px solid rgba(31,27,22,0.18);
                border-radius: 6px;
                background: rgba(31,27,22,0.02);
            }
            @media (prefers-color-scheme: dark) {
                .seq-box { border-color: rgba(232,227,214,0.20); background: rgba(232,227,214,0.03); }
            }
            .seq-cap { font-size: 12.5px; line-height: 1.35; opacity: 0.7; margin-top: 0.4rem; text-align: center; }
            .seq-join { align-self: center; margin-top: 22px; opacity: 0.35; font-size: 16px; }
            .seq-box .fixation { font-size: 30px; line-height: 1; }
            .seq-box .flanker-row { gap: 7px; }
            .seq-box .fl-arrow { width: 32px; height: 19px; }

            .examples {
                margin: 0 0 1.2rem;
                border-top: 1px solid rgba(122,43,39,0.18);
                border-bottom: 1px solid rgba(122,43,39,0.18);
            }
            .example {
                display: flex; align-items: center; justify-content: space-between;
                gap: 1.2rem; padding: 0.6rem 0.1rem;
            }
            .example + .example { border-top: 1px solid rgba(122,43,39,0.10); }
            @media (prefers-color-scheme: dark) {
                .examples { border-color: rgba(224,162,74,0.28); }
                .example + .example { border-top-color: rgba(224,162,74,0.16); }
            }
            .example .flanker-row { gap: 8px; }
            .example .fl-arrow { width: 38px; height: 22px; }
            .example .note { font-size: 14px; opacity: 0.7; flex: 1; }

            .debrief-table { margin: 1.5rem auto; border-collapse: collapse; font-size: 18px; }
            .debrief-table td { padding: 6px 18px; border-bottom: 1px solid rgba(0,0,0,0.12); text-align: left; }
            .debrief-table td:last-child { text-align: right; font-weight: 600; }
        </style>
    </head>
    <body>
        <script>
            /* restore saved language */
            try {
                const savedLang = localStorage.getItem('ce.lang');
                document.documentElement.lang = (savedLang === 'hu' || savedLang === 'en') ? savedLang : 'hu';
            } catch (e) { document.documentElement.lang = 'hu'; }

/* cog_site build 2026-09-05-a — FLANKER  */
/*
console.log('[cog_site] FLANKER build 2026-09-05-a');
*/

/* Stop SPACE and the arrow keys from scrolling the page mid-trial.
   preventDefault only — jsPsych's own listener still receives the event. */
window.addEventListener('keydown', function (e) {
    if ([' ', 'Spacebar', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) !== -1) {
        e.preventDefault();
    }
}, { passive: false });

/* ESC leaves the experiment. First press opens a confirm panel, a second
   press returns to the page the participant arrived from. Pass
   { confirm: false } to leave on the first press instead. */
ceEnableExit();


            /* response keys */
            const KEY_LEFT  = 'a';   // middle arrow points left
            const KEY_RIGHT = 'l';   // middle arrow points right

            /* STIMULI */
            /* Arrows are SVG, no image assets needed. The viewBox is 100x60:
               shaft runs x=10..62 at 10 units thick, head is 38 long and 46 wide,
               so the head reads clearly at small sizes. */
            function arrowSVG(direction) {
                const body =
                    '<line x1="10" y1="30" x2="62" y2="30" stroke="currentColor" '
                  + 'stroke-width="11" stroke-linecap="round"/>'
                  + '<path d="M 94 30 L 56 7 L 56 53 Z" fill="currentColor"/>';
                const g = (direction === 'left')
                    ? '<g transform="translate(100,0) scale(-1,1)">'
                    : '<g>';
                return '<svg class="fl-arrow" viewBox="0 0 100 60" aria-hidden="true">'
                     + g + body + '</g></svg>';
            }

            /* A five-arrow row. The middle arrow is the target;
               congruent = flankers match it, incongruent = flankers oppose it. */
            function flankerRow(direction, condition) {
                const flank = (condition === 'congruent')
                    ? direction
                    : (direction === 'left' ? 'right' : 'left');
                const f = arrowSVG(flank), c = arrowSVG(direction);
                return `<div class="flanker-row">${f}${f}${c}${f}${f}</div>`;
            }

            const stimuli = [
                { correct_response: KEY_LEFT,  condition: 'congruent',   direction: 'left'  },
                { correct_response: KEY_RIGHT, condition: 'congruent',   direction: 'right' },
                { correct_response: KEY_LEFT,  condition: 'incongruent', direction: 'left'  },
                { correct_response: KEY_RIGHT, condition: 'incongruent', direction: 'right' }
            ];

            /* INIT */
            const jsPsych = initJsPsych();

            const timeline = [];

            /* INSTRUCTIONS */
            const sampleSequence = `
            <div class="seq">
                <div class="seq-step">
                    <div class="seq-box"><div class="fixation">+</div></div>
                    <div class="seq-cap"><span class="hu">Kereszt</span><span class="en">Fixation cross</span></div>
                </div>
                <div class="seq-join">&rarr;</div>
                <div class="seq-step">
                    <div class="seq-box">${flankerRow('left', 'incongruent')}</div>
                    <div class="seq-cap"><span class="hu">Nyilak — válaszoljon</span><span class="en">Arrows — respond</span></div>
                </div>
            </div>`;

            const examples = `
            <div class="examples">
                <div class="example">
                    ${flankerRow('left', 'congruent')}
                    <span class="note"><span class="hu">a középső balra mutat</span><span class="en">middle points left</span></span>
                    <kbd>A</kbd>
                </div>
                <div class="example">
                    ${flankerRow('right', 'incongruent')}
                    <span class="note"><span class="hu">a középső jobbra mutat</span><span class="en">middle points right</span></span>
                    <kbd>L</kbd>
                </div>
            </div>`;

            timeline.push({
                type: jsPsychHtmlKeyboardResponse,
                choices: [' '],
                stimulus: `
                <div class="instr">
                    <h2><span class="hu">Flanker feladat</span><span class="en">Flanker task</span></h2>
                    ${sampleSequence}
                    <p>
                        <span class="hu">Öt nyíl jelenik meg a képernyő közepén. Csak a <strong>középső</strong>
                            nyíl számít — döntse el, merre mutat.</span>
                        <span class="en">Five arrows appear in the middle of the screen. Only the <strong>middle</strong>
                            arrow counts — decide which way it points.</span>
                    </p>
                    ${examples}
                    <p class="hint">
                        <span class="hu">A négy szélső nyíl néha az ellenkező irányba mutat. Ne hagyja magát megzavarni.
                            Válaszoljon minél gyorsabban és pontosabban — a válasz után rögtön jön a következő próba.</span>
                        <span class="en">The four outer arrows sometimes point the other way. Don't let them distract you.
                            Respond as quickly and accurately as you can — the next trial starts right after your answer.</span>
                    </p>
                    <p class="go">
                        <span class="hu"><kbd>SPACE</kbd> — indítás</span>
                        <span class="en"><kbd>SPACE</kbd> — start</span>
                    </p>
                </div>`,
                post_trial_gap: 800
            });

            /* TRIAL COMPONENTS */
            const fixation = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '<div class="fixation">+</div>',
                choices: "NO_KEYS",
                trial_duration: function () {
                    return jsPsych.randomization.sampleWithoutReplacement([250, 500, 750, 1000, 1250], 1)[0];
                },
                data: { task: 'fixation' }
            };

            const test = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: function () {
                    return flankerRow(
                        jsPsych.evaluateTimelineVariable('direction'),
                        jsPsych.evaluateTimelineVariable('condition')
                    );
                },
                choices: [KEY_LEFT, KEY_RIGHT],
                trial_duration: 2000,
                /* Explicit: the keypress clears the screen immediately instead of
                   holding the arrows for the full 2 s. post_trial_gap gives a short
                   blank so consecutive trials don't blur into each other. */
                response_ends_trial: true,
                post_trial_gap: 250,
                data: {
                    task:             'response',
                    correct_response: jsPsych.timelineVariable('correct_response'),
                    condition:        jsPsych.timelineVariable('condition'),
                    direction:        jsPsych.timelineVariable('direction')
                },
                on_finish: function (data) {
                    data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
                }
            };


        // making blocks
        function makeBlock(repetitions) {
            return {
                timeline: [fixation, test],
                timeline_variables: stimuli,
                randomize_order: true,
                repetitions: repetitions
            };
        }

        function betweenBlockInst(blockNum) {
            return {
                type: jsPsychHtmlKeyboardResponse,
                choices: [' '],
                stimulus: `
                <div class="instr">
                    <p>
                        <span class="hu">A(z) ${blockNum}. blokk vége. Pihenjen, ameddig szeretne.</span>
                        <span class="en">End of block ${blockNum}. Take a break for as long as you like.</span>
                    </p>
                    ${examples}
                    <p class="go">
                        <span class="hu"><kbd>SPACE</kbd> — folytatás</span>
                        <span class="en"><kbd>SPACE</kbd> — continue</span>
                    </p>
                </div>`,
                post_trial_gap: 800
            };
        }

        const REPS = 5; // 4 stimuli x 5 reps = 20 trials per block

        // With response_ends_trial a trial is ~1.5 s (fixation ~0.75 s +
        // RT ~0.5 s + 0.25 s gap), not ~2.45 s, so a block is ~30 s not ~49 s.
        // Block counts re-scaled so the durations still mean what they say:
        // Short ~3min, Medium ~5min, Long ~10min.
        const LENGTHS = { short: 6, medium: 10, long: 20 };   // blocks per duration

        ceChooseDuration().then(function (choice) {
            const N_BLOCKS = LENGTHS[choice];
            for (let b = 1; b <= N_BLOCKS; b++) {
                timeline.push(makeBlock(REPS));
                if (b < N_BLOCKS) timeline.push(betweenBlockInst(b));
            }

            // "debriefing" == charted result screening
            timeline.push(ceResultsScreen(jsPsych, {
                compute: function (jp) {
                    const en = (document.documentElement.lang === 'en');
                    const trials   = jp.data.get().filter({ task: 'response' });
                    const answered = trials.filterCustom(function (t) { return t.rt !== null; });
                    const correct  = trials.filter({ correct: true });
                    const wrong    = answered.count() - correct.count();
                    const missed   = trials.count() - answered.count();

                    const rtCong   = Math.round(correct.filter({ condition: 'congruent'   }).select('rt').mean()) || 0;
                    const rtIncong = Math.round(correct.filter({ condition: 'incongruent' }).select('rt').mean()) || 0;

                    const rows = [
                        { label_hu: 'Helyes válaszok', label_en: 'Correct responses',   value: correct.count() },
                        { label_hu: 'Hibás válaszok',  label_en: 'Incorrect responses', value: wrong }
                    ];
                    if (missed > 0) {
                        rows.push({ label_hu: 'Nem válaszolt', label_en: 'No response', value: missed });
                    }
                    rows.push({ label_hu: 'Átlagos reakcióidő', label_en: 'Mean reaction time',
                                value: (Math.round(correct.select('rt').mean()) || 0) + ' ms' });
                    rows.push({ label_hu: 'Reakcióidő — kongruens',   label_en: 'RT — congruent',   value: rtCong + ' ms' });
                    rows.push({ label_hu: 'Reakcióidő — inkongruens', label_en: 'RT — incongruent', value: rtIncong + ' ms' });

                    return {
                        rows: rows,
                        chart: {
                            kind: 'bar',
                            title: en ? 'Reaction time by condition' : 'Reakcióidő feltételenként',
                            bars: [
                                { label: en ? 'Congruent'   : 'Kongruens',   value: rtCong,   unit: 'ms' },
                                { label: en ? 'Incongruent' : 'Inkongruens', value: rtIncong, unit: 'ms' }
                            ]
                        }
                    };
                }
            }));

            jsPsych.run(timeline);
        });

        </script>
    </body>
</html>
