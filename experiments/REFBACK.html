<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visszacsatolási Paradigma (REFBACK)</title>

    <script src="https://unpkg.com/jspsych@8.2.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" />
    <script src="ce-duration.js"></script>
    <script src="ce-chart.js"></script>

    <link rel="stylesheet" href="REFBACK.css" />
</head>
<body>
<script>

/* restore saved language (always ends with a concrete value) */
try {
    const savedLang = localStorage.getItem('ce.lang');
    document.documentElement.lang = (savedLang === 'hu' || savedLang === 'en') ? savedLang : 'hu';
} catch (e) { document.documentElement.lang = 'hu'; }

/* cog_site build 2026-09-02-a — REFBACK */
/*
console.log('[cog_site] REFBACK build 2026-09-02-a');
*/

/* Stop SPACE and the arrow keys from scrolling the page mid-trial.
   preventDefault only — jsPsych's own listener still receives the event. */
window.addEventListener('keydown', function (e) {
    if ([' ', 'Spacebar', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) !== -1) {
        e.preventDefault();
    }
}, { passive: false });


/* response keys */
const KEY_LEFT  = 'a';
const KEY_RIGHT = 'l';

/* stimulus pool */
const LETTERS = ['X', 'O'];
const FRAMES  = ['red', 'blue'];

const jsPsych = initJsPsych();

const timeline = [];

let currentReference = null;
let pendingReference = null;
let pendingIsMatch   = null;

/* shared components */
const fixation = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="fixation">+</div>',
    choices: "NO_KEYS",
    trial_duration: function () {
        return jsPsych.randomization.sampleWithoutReplacement([500, 750, 1000], 1)[0];
    },
    data: { task: 'fixation' }
};

/* Renders the coloured frame; `frame` is actually used */
function frameStim(letter, frame) {
    return `<div class="refback-frame ${frame}">
                <span class="refback-letter">${letter}</span>
            </div>`;
}

/* Same stimulus at instruction-screen size. */
function miniStim(letter, frame) {
    return `<div class="refback-frame mini ${frame}">
                <span class="refback-letter">${letter}</span>
            </div>`;
}

/* Section I: identity */
function buildIdentityList(n) {
    const list = [];
    for (let i = 0; i < n; i++) {
        list.push({
            letter: jsPsych.randomization.sampleWithReplacement(LETTERS, 1)[0],
            frame:  jsPsych.randomization.sampleWithReplacement(FRAMES, 1)[0]
        });
    }
    return list;
}

const identityTrial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function () {
        return frameStim(
            jsPsych.evaluateTimelineVariable('letter'),
            jsPsych.evaluateTimelineVariable('frame')
        );
    },
    choices: [KEY_LEFT, KEY_RIGHT],
    trial_duration: 2500,
    data: {
        task:   'identity',
        letter: jsPsych.timelineVariable('letter'),
        frame:  jsPsych.timelineVariable('frame')
    },
    on_finish: function (data) {
        const expected = (data.letter === 'X') ? KEY_LEFT : KEY_RIGHT;
        data.correct = jsPsych.pluginAPI.compareKeys(data.response, expected);
    }
};

function identityBlock(n) {
    return { timeline: [fixation, identityTrial], timeline_variables: buildIdentityList(n) };
}

/* Section II: reference-back */
function buildRefbackList(n) {
    const list = [];
    /* trial 0 is the designated reference -> always red, never scored */
    list.push({
        letter: jsPsych.randomization.sampleWithReplacement(LETTERS, 1)[0],
        frame: 'red',
        is_designator: true
    });
    for (let i = 1; i < n; i++) {
        list.push({
            letter: jsPsych.randomization.sampleWithReplacement(LETTERS, 1)[0],
            frame:  jsPsych.randomization.sampleWithReplacement(FRAMES, 1)[0],
            is_designator: false
        });
    }
    return list;
}

const refbackTrial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function () {
        return frameStim(
            jsPsych.evaluateTimelineVariable('letter'),
            jsPsych.evaluateTimelineVariable('frame')
        );
    },
    choices: [KEY_LEFT, KEY_RIGHT],
    trial_duration: 2500,
    data: {
        task:          'refback',
        letter:        jsPsych.timelineVariable('letter'),
        frame:         jsPsych.timelineVariable('frame'),
        is_designator: jsPsych.timelineVariable('is_designator')
    },
    on_start: function () {
        pendingReference = currentReference;
        const thisLetter = jsPsych.evaluateTimelineVariable('letter');
        pendingIsMatch = (currentReference !== null) ? (thisLetter === currentReference) : null;
    },
    on_finish: function (data) {
        data.reference_before = pendingReference;
        data.is_match         = pendingIsMatch;

        if (data.is_designator || pendingReference === null) {
            data.correct = null;                    // unscored reference trial
        } else {
            /* match -> L (right), mismatch -> A (left) — matches the instructions */
            const expected = data.is_match ? KEY_RIGHT : KEY_LEFT;
            data.correct = jsPsych.pluginAPI.compareKeys(data.response, expected);
        }
        /* red frame updates the held reference, blue does not */
        if (data.frame === 'red') currentReference = data.letter;
    }
};

function refbackBlock(n) {
    return { timeline: [fixation, refbackTrial], timeline_variables: buildRefbackList(n) };
}

/* instruction content */

/* Section I: what a trial looks like and which key goes with which letter. */
const briefIdentity = `
<div class="demo">
    <div class="demo-step">
        ${miniStim('X', 'blue')}
        <div class="demo-cap"><span class="hu">X betű</span><span class="en">letter X</span></div>
    </div>
    <div class="demo-step">
        ${miniStim('O', 'red')}
        <div class="demo-cap"><span class="hu">O betű</span><span class="en">letter O</span></div>
    </div>
</div>
<p>
    <span class="hu">Betűk jelennek meg egy színes keretben. Most csak a <strong>betű</strong> számít —
        a keret színe nem.</span>
    <span class="en">Letters appear inside a coloured frame. For now only the <strong>letter</strong> matters —
        the frame colour does not.</span>
</p>
<ul class="keys">
    <li>
        <span><span class="hu">A betű <strong>X</strong></span><span class="en">The letter is <strong>X</strong></span></span>
        <kbd>A</kbd>
    </li>
    <li>
        <span><span class="hu">A betű <strong>O</strong></span><span class="en">The letter is <strong>O</strong></span></span>
        <kbd>L</kbd>
    </li>
</ul>`;

/* Section II: a worked four-trial sequence, since the rule is easier to see
   than to read. */
const briefRefback = `
<div class="demo">
    <div class="demo-step">
        ${miniStim('X', 'red')}
        <div class="demo-cap"><span class="hu">piros keret &mdash; ezt jegyezze meg</span><span class="en">red frame &mdash; remember this one</span></div>
    </div>
    <div class="demo-join">&rarr;</div>
    <div class="demo-step">
        ${miniStim('X', 'blue')}
        <div class="demo-cap"><span class="hu">megegyezik &rarr; <kbd>L</kbd></span><span class="en">matches &rarr; <kbd>L</kbd></span></div>
    </div>
    <div class="demo-join">&rarr;</div>
    <div class="demo-step">
        ${miniStim('O', 'blue')}
        <div class="demo-cap"><span class="hu">különbözik &rarr; <kbd>A</kbd></span><span class="en">differs &rarr; <kbd>A</kbd></span></div>
    </div>
    <div class="demo-join">&rarr;</div>
    <div class="demo-step">
        ${miniStim('O', 'red')}
        <div class="demo-cap"><span class="hu">új piros &mdash; mostantól ez az emlékezet</span><span class="en">new red &mdash; this replaces it</span></div>
    </div>
</div>
<p>
    <span class="hu">Tartsa fejben a legutóbbi <strong>piros keretes</strong> betűt, és minden képhez
        hasonlítsa hozzá az éppen látott betűt.</span>
    <span class="en">Hold the most recent <strong>red-framed</strong> letter in mind, and compare
        every letter you see against it.</span>
</p>
<ul class="keys">
    <li>
        <span><span class="hu">Megegyezik a piros keretes betűvel</span><span class="en">Same as the red-framed letter</span></span>
        <kbd>L</kbd>
    </li>
    <li>
        <span><span class="hu">Különbözik tőle</span><span class="en">Different from it</span></span>
        <kbd>A</kbd>
    </li>
</ul>
<p class="hint">
    <span class="hu">A piros keret kettőt kér: válaszoljon rá, és attól kezdve azt tartsa fejben.
        A kék keret csak összehasonlítás — nem cseréli le az emlékezetben tartott betűt.</span>
    <span class="en">A red frame does two jobs: answer for it, then hold it in mind from that point on.
        A blue frame is only a comparison — it does not replace the letter you are holding.</span>
</p>`;

/* instruction screens */
function introScreen(titleHu, titleEn, brief) {
    return {
        type: jsPsychHtmlKeyboardResponse,
        choices: [' '],
        stimulus: `
        <div class="instr">
            <h2><span class="hu">${titleHu}</span><span class="en">${titleEn}</span></h2>
            ${brief}
            <p class="go">
                <span class="hu"><kbd>SPACE</kbd> — indítás</span>
                <span class="en"><kbd>SPACE</kbd> — start</span>
            </p>
        </div>`,
        post_trial_gap: 600
    };
}

/* Between blocks the whole brief is shown again, so the rule never has to be
   recalled from the start of the section. */
function breakScreen(num, brief) {
    return {
        type: jsPsychHtmlKeyboardResponse,
        choices: [' '],
        stimulus: `
        <div class="instr">
            <p>
                <span class="hu">A(z) ${num}. blokk vége. Pihenjen, ameddig szeretne.</span>
                <span class="en">End of block ${num}. Take a break for as long as you like.</span>
            </p>
            ${brief}
            <p class="go">
                <span class="hu"><kbd>SPACE</kbd> — folytatás</span>
                <span class="en"><kbd>SPACE</kbd> — continue</span>
            </p>
        </div>`,
        post_trial_gap: 600
    };
}

const introIdentity = introScreen('I. szakasz &mdash; betűk', 'Section I &mdash; letters', briefIdentity);
const introRefback  = introScreen('II. szakasz &mdash; visszacsatolás', 'Section II &mdash; reference-back', briefRefback);

/* timeline
   ~2.3 s per trial (fixation ~0.75 s + response ~1.5 s), two sections.
   trials/section = target_seconds / (2 x 2.3)                        */
const LENGTHS      = { short: 40, medium: 65, long: 130 };  // trials per section
const BLOCK_LENGTH = 32;                                    // break every 32 trials

function section(nTotal, builder, brief) {
    const nodes = [];
    let done = 0, blockNum = 1;
    while (done < nTotal) {
        const size = Math.min(BLOCK_LENGTH, nTotal - done);
        nodes.push(builder(size));
        done += size;
        if (done < nTotal) nodes.push(breakScreen(blockNum, brief));
        blockNum++;
    }
    return nodes;
}

ceChooseDuration().then(function (choice) {
    const N = LENGTHS[choice] || LENGTHS.medium;

    timeline.push(introIdentity);
    section(N, identityBlock, briefIdentity).forEach(n => timeline.push(n));

    timeline.push(introRefback);
    /* reset the reference before Section II */
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        choices: "NO_KEYS",
        trial_duration: 1,
        stimulus: '',
        on_start: function () { currentReference = null; }
    });
    section(N, refbackBlock, briefRefback).forEach(n => timeline.push(n));

    timeline.push(ceResultsScreen(jsPsych, {
        compute: function (jp) {
            const en = (document.documentElement.lang === 'en');

            /* Section I — identity */
            const id         = jp.data.get().filter({ task: 'identity' });
            const idAnswered = id.filterCustom(function (t) { return t.rt !== null; });
            const idCorrect  = id.filter({ correct: true });
            const idWrong    = idAnswered.count() - idCorrect.count();

            /* Section II — reference-back, excluding the unscored reference trials */
            const rb         = jp.data.get().filter({ task: 'refback' });
            const scored     = rb.filterCustom(function (t) { return t.correct !== null; });
            const rbAnswered = scored.filterCustom(function (t) { return t.rt !== null; });
            const rbCorrect  = scored.filter({ correct: true });
            const rbWrong    = rbAnswered.count() - rbCorrect.count();

            const missed = (id.count() - idAnswered.count()) + (scored.count() - rbAnswered.count());

            const idRt       = Math.round(idCorrect.select('rt').mean()) || 0;
            const rtMatch    = Math.round(rbCorrect.filter({ is_match: true  }).select('rt').mean()) || 0;
            const rtMismatch = Math.round(rbCorrect.filter({ is_match: false }).select('rt').mean()) || 0;
            const rbRt       = Math.round(rbCorrect.select('rt').mean()) || 0;

            const rows = [
                { label_hu: 'Helyes válaszok', label_en: 'Correct responses',
                  value: (idCorrect.count() + rbCorrect.count()) },
                { label_hu: 'Hibás válaszok', label_en: 'Incorrect responses',
                  value: (idWrong + rbWrong) }
            ];
            if (missed > 0) {
                rows.push({ label_hu: 'Nem válaszolt', label_en: 'No response', value: missed });
            }
            rows.push({ label_hu: 'I. szakasz — reakcióidő',  label_en: 'Section I — reaction time',  value: idRt + ' ms' });
            rows.push({ label_hu: 'II. szakasz — reakcióidő', label_en: 'Section II — reaction time', value: rbRt + ' ms' });
            rows.push({ label_hu: 'Reakcióidő — egyezés',     label_en: 'RT — match',                 value: rtMatch + ' ms' });
            rows.push({ label_hu: 'Reakcióidő — eltérés',     label_en: 'RT — mismatch',           value: rtMismatch + ' ms' });
            rows.push({ label_hu: 'Frissitési költség',     label_en: 'No Switch',           value: ((rtMismatch-rtMatch)-(rtMismatch-rtMatch)) + ' ms' });
            rows.push({ label_hu: 'Kapunyitás',     label_en: 'Gate opening',           value: (Switchref-NoSwitchref) + ' ms' });
            rows.push({ label_hu: 'Kapiuzárás',     label_en: 'Gate Closing',           value: (Sitchcomp - NoSwitchcomp) + ' ms' });

            return {
                rows: rows,
                chart: {
                    kind: 'bar',
                    title: en ? 'Reaction time by trial type' : 'Reakcióidő próbatípusonként',
                    bars: [
                        { label: en ? 'Section I' : 'I. szakasz', value: idRt,       unit: 'ms' },
                        { label: en ? 'Match'     : 'Egyezés',    value: rtMatch,    unit: 'ms' },
                        { label: en ? 'Mismatch'  : 'Eltérés',    value: rtMismatch, unit: 'ms' },
                        {label: en ? 'Refresh cost' : 'No switch', value: rtMismatch - rtMatch, unit: 'ms'},
                        {label: en ? 'Gate opening' : 'Reference', value: rtMismatch - rtMatch, unit: 'ms'},
                        {label: en ? 'Gate closing' : 'Comparison', value: rtMismatch - rtMatch, unit: 'ms'},
                    ]
                }
            };
        }
    }));

    jsPsych.run(timeline);
});
</script>
</body>
</html>
