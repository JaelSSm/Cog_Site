<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title> Figyelmi hálózat (ANT) </title>

        <script src="https://unpkg.com/jspsych@8.2.3"></script>
        <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
        <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" />
        <script src="ce-duration.js"></script>
        <script src="ce-chart.js"></script>
        <script src="ce-exit.js"></script>

        <style>

            /* jsPsych v8: .jspsych-content collapses to zero WIDTH inside the
               flex wrapper. Give it explicit width and centre it. */
            html, body { min-height: 100vh; margin: 0; }
            .jspsych-display-element { width: 100%; min-height: 100vh; }
            .jspsych-content-wrapper { width: 100%; }
            .jspsych-content { width: 100%; max-width: 900px; margin: auto; }

            /* Bilingual: hide the inactive language */
            [lang="hu"] .en { display: none; }
            [lang="en"] .hu { display: none; }

            /* Page theme matching the rest of the site */
            body {
            background: #FBF7EE;
            color: #1F1B16;
            font-family: "Public Sans", system-ui, sans-serif;
            }
            @media (prefers-color-scheme: dark) {
            body { background: #181612; color: #E8E3D6; }
            }


            /* Stimulus rendering */
            .ant-stage{
                position: relative;
                width: 600px;
                height: 360px;
                margin: 0 auto;
            }

            /* Everything on the stage is anchored by its own centre, so the
               cue and the target row sit on exactly the same two rows. */
            .ant-fix {
                position: absolute;
                top: 50%; left: 50%;
                transform: translate(-50%, -50%);
                font-size: 44px;
                line-height: 1;
            }

            /* The cue is an SVG asterisk: geometrically centred inside its own
               box, so translate(-50%,-50%) puts it exactly on the row.
               A text "*" sits high in the line box and would not line up. */
            .ant-cue {
                position: absolute;
                left: 50%;
                transform: translate(-50%, -50%);
                line-height: 0;
                color: #7A2B27;
            }
            @media (prefers-color-scheme: dark) {
                .ant-cue { color: #E0A24A; }
            }
            .ant-cue.center { top: 50%; }
            .ant-cue.top    { top: 25%; }
            .ant-cue.bottom { top: 75%; }

            .ant-target{
                position: absolute;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 46px;
                letter-spacing: 0.10em;
                line-height: 1;
                font-family: "DejaVu Sans Mono", "Menlo", monospace;
                white-space: nowrap;
            }
            .ant-target.top    { top: 25%; }
            .ant-target.bottom { top: 75%; }


            /* Instruction screens */
            .instr {
                max-width: 620px;
                margin: 0 auto;
                text-align: left;
                line-height: 1.6;
                font-size: 17px;
            }
            .instr h2 {
                font-family: "Cormorant Garamond", Georgia, serif;
                font-size: 28px;
                font-weight: 600;
                margin: 0 0 1.1rem;
                text-align: center;
            }
            .instr p { margin: 0 0 1rem; }
            .instr .keys {
                list-style: none;
                padding: 0;
                margin: 0 0 1.1rem;
                border-top: 1px solid rgba(122,43,39,0.18);
                border-bottom: 1px solid rgba(122,43,39,0.18);
            }
            .instr .keys li {
                display: flex;
                justify-content: space-between;
                gap: 1.5rem;
                padding: 0.5rem 0.1rem;
            }
            .instr .keys li + li { border-top: 1px solid rgba(122,43,39,0.10); }
            @media (prefers-color-scheme: dark) {
                .instr .keys { border-color: rgba(224,162,74,0.28); }
                .instr .keys li + li { border-top-color: rgba(224,162,74,0.16); }
            }
            .instr .hint { font-size: 14.5px; opacity: 0.68; }
            .instr .go { text-align: center; font-size: 14.5px; opacity: 0.68; margin-bottom: 0; }

            kbd {
                font-family: inherit;
                font-size: 0.92em;
                font-weight: 600;
                padding: 0.12em 0.5em;
                border: 1px solid rgba(31,27,22,0.28);
                border-bottom-width: 2px;
                border-radius: 5px;
                background: rgba(31,27,22,0.05);
                white-space: nowrap;
            }
            @media (prefers-color-scheme: dark) {
                kbd { border-color: rgba(232,227,214,0.30); background: rgba(232,227,214,0.07); }
            }

            /* Sample sequence shown with the instructions */
            .seq {
                display: flex;
                align-items: flex-start;
                justify-content: center;
                gap: 8px;
                margin: 0 auto 1.4rem;
                flex-wrap: wrap;
            }
            .seq-step { width: 118px; }
            .seq-box {
                position: relative;
                width: 118px;
                height: 82px;
                border: 1px solid rgba(31,27,22,0.18);
                border-radius: 6px;
                background: rgba(31,27,22,0.02);
            }
            @media (prefers-color-scheme: dark) {
                .seq-box { border-color: rgba(232,227,214,0.20); background: rgba(232,227,214,0.03); }
            }
            .seq-cap { font-size: 12.5px; line-height: 1.35; opacity: 0.7; margin-top: 0.4rem; text-align: center; }
            .seq-join { align-self: center; margin-top: 26px; opacity: 0.35; font-size: 16px; }

            .seq-fix { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 17px; line-height: 1; }
            .seq-cue { position: absolute; left: 50%; transform: translate(-50%, -50%); line-height: 0; color: #7A2B27; }
            @media (prefers-color-scheme: dark) { .seq-cue { color: #E0A24A; } }
            .seq-cue.top { top: 25%; }
            .seq-tgt {
                position: absolute; left: 50%; top: 25%;
                transform: translate(-50%, -50%);
                font-family: "DejaVu Sans Mono", "Menlo", monospace;
                font-size: 15px; letter-spacing: 0.06em; line-height: 1; white-space: nowrap;
            }

            .debrief-table{ margin: 1.5rem auto; border-collapse: collapse; font-size: 18px; }
            .debrief-table td { padding: 6px 18px; border-bottom: 1px solid rgba(0,0,0,0.12); text-align: left; }
            .debrief-table td:last-child { text-align: right; font-weight: 600; }
        </style>
    </head>
    <body>

    <script>
        /* restore saved language — always ends with a concrete value, otherwise
           <html> has no lang and BOTH languages render at once */
        try {
            const savedLang = localStorage.getItem('ce.lang');
            document.documentElement.lang = (savedLang === 'hu' || savedLang === 'en') ? savedLang : 'hu';
        } catch (e) { document.documentElement.lang = 'hu'; }

/* cog_site build 2026-09-05-a — ANT  */
/*
console.log('[cog_site] ANT build 2026-09-05-a');
*/
/* Stop SPACE and the arrow keys from scrolling the page mid-trial.
   preventDefault only — jsPsych's own listener still receives the event. */
window.addEventListener('keydown', function (e) {
    if ([' ', 'Spacebar', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) !== -1) {
        e.preventDefault();
    }
}, { passive: false });

/* ESC leaves the experiment. First press opens a confirm panel, a second
   press returns to the page the participant arrived from. Pass
   { confirm: false } to leave on the first press instead. */
ceEnableExit();



        /* Response keys*/
        const KEY_LEFT  = 'arrowleft';
        const KEY_RIGHT = 'arrowright';

        // stimuli
        const LARR = '\u2190', RARR = '\u2192', DASH = '\u2014';  // ← → —

        /* Cue asterisk drawn as three lines through the centre of the viewBox.
           Deterministically centred, and CUE_SIZE controls it in one place. */
        const CUE_SIZE = 30;   // px — smaller than the 46px arrows

        function asteriskSVG(size) {
            const c = size / 2, r = size * 0.46;
            let lines = '';
            for (let i = 0; i < 3; i++) {
                const a  = (i * 60 + 90) * Math.PI / 180;
                const dx = Math.cos(a) * r, dy = Math.sin(a) * r;
                lines += `<line x1="${(c - dx).toFixed(2)}" y1="${(c - dy).toFixed(2)}" `
                       + `x2="${(c + dx).toFixed(2)}" y2="${(c + dy).toFixed(2)}"/>`;
            }
            return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">`
                 + `<g stroke="currentColor" stroke-width="${(size * 0.15).toFixed(2)}" stroke-linecap="round">`
                 + `${lines}</g></svg>`;
        }

        // building the arrows
        // congruent: flankers are same as center
        // in-congruent: flankers are opposite from center
        // neutral: no direction
        function targetRow(direction, congruency) {
            const center = (direction === 'left') ? LARR : RARR;
            let flank;
            if (congruency === 'neutral'){
                flank = DASH;
            } else if (congruency === 'congruent') {
                flank = center;
            } else if (congruency === 'incongruent') {
                flank = (direction === 'left') ? RARR : LARR;
            }
            return flank + flank + center + flank + flank;

        }


        const CUE_DURATION = 150;
        const CUES = ['none', 'center', 'double', 'spatial'];
        const CONG = ['congruent', 'incongruent', 'neutral'];
        const DIR = ['left', 'right'];
        const POS = ['top', 'bottom'];

        // 4x 3x 2x 2 = 48 unique trials
        function buildTrialList(reps){
            const list = [];
            for(let r = 0; r < reps; r++){
                CUES.forEach(cue => CONG.forEach(cong => DIR.forEach(dir => POS.forEach(pos => list.push({cue: cue, congruency: cong, direction: dir, position: pos})))));
            }
            return jsPsych.randomization.shuffle(list);
        }


        /* initialize experiment */
        const jsPsych = initJsPsych();

        const timeline = [];


        /* instructions */

        /* A miniature of one trial, so the participant knows what to expect. */
        const sampleSequence = `
        <div class="seq">
            <div class="seq-step">
                <div class="seq-box"><div class="seq-fix">+</div></div>
                <div class="seq-cap"><span class="hu">Kereszt</span><span class="en">Fixation cross</span></div>
            </div>
            <div class="seq-join">&rarr;</div>
            <div class="seq-step">
                <div class="seq-box">
                    <div class="seq-fix">+</div>
                    <div class="seq-cue top">${asteriskSVG(15)}</div>
                </div>
                <div class="seq-cap"><span class="hu">Jelzés (csillag)</span><span class="en">Cue (asterisk)</span></div>
            </div>
            <div class="seq-join">&rarr;</div>
            <div class="seq-step">
                <div class="seq-box"><div class="seq-fix">+</div></div>
                <div class="seq-cap"><span class="hu">Rövid szünet</span><span class="en">Short pause</span></div>
            </div>
            <div class="seq-join">&rarr;</div>
            <div class="seq-step">
                <div class="seq-box">
                    <div class="seq-fix">+</div>
                    <div class="seq-tgt">${targetRow('left', 'incongruent')}</div>
                </div>
                <div class="seq-cap"><span class="hu">Nyilak — válaszoljon</span><span class="en">Arrows — respond</span></div>
            </div>
        </div>`;

        const keyList = `
        <ul class="keys">
            <li>
                <span><span class="hu">A középső nyíl balra mutat</span><span class="en">Middle arrow points left</span></span>
                <span><kbd>&larr;</kbd></span>
            </li>
            <li>
                <span><span class="hu">A középső nyíl jobbra mutat</span><span class="en">Middle arrow points right</span></span>
                <span><kbd>&rarr;</kbd></span>
            </li>
        </ul>`;

        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            choices: [' '],
            stimulus:`
            <div class="instr">
                <h2><span class="hu">Figyelmi hálózat</span><span class="en">Attention Network Task</span></h2>
                ${sampleSequence}
                <p>
                    <span class="hu">Nézze végig a keresztet a képernyő közepén. A nyilak sora a kereszt fölött
                        vagy alatt jelenik meg — döntse el, merre mutat a <strong>középső</strong> nyíl.</span>
                    <span class="en">Keep your eyes on the cross in the middle of the screen. A row of arrows appears
                        above or below it — decide which way the <strong>middle</strong> arrow points.</span>
                </p>
                ${keyList}
                <p class="hint">
                    <span class="hu">A csillag csak jelzés: néha megmutatja, hol jönnek a nyilak, néha nem.
                        A szélső nyilak félrevezethetik — hagyja őket figyelmen kívül.
                        Válaszoljon minél gyorsabban és pontosabban.</span>
                    <span class="en">The asterisk is only a cue: sometimes it shows where the arrows will appear, sometimes not.
                        The outer arrows can mislead you — ignore them.
                        Respond as quickly and accurately as you can.</span>
                </p>
                <p class="go">
                    <span class="hu"><kbd>SPACE</kbd> — indítás</span>
                    <span class="en"><kbd>SPACE</kbd> — start</span>
                </p>
            </div>`,
          post_trial_gap: 500
        });


        // trial components
        //1. initial fixation (variable dur)
        const fixation1 = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="ant-stage"><div class="ant-fix">+</div></div>',
            choices: "NO_KEYS",
            trial_duration: function () {
                return jsPsych.randomization.sampleWithoutReplacement([400, 600, 800, 1000, 1200, 1400, 1600], 1)[0];
            },
            data: { task: 'fixation1' }
        };

        //2. cue
        const cue = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function(){
                const cueType = jsPsych.evaluateTimelineVariable('cue');
                const pos = jsPsych.evaluateTimelineVariable('position');
                const star = asteriskSVG(CUE_SIZE);

                /* The CENTRE cue replaces the fixation cross (classic ANT):
                   the cross is simply not drawn, so nothing shows through. */
                   // somehow it still shows through ***
                let cues = (cueType === 'center') ? '' : `<div class="ant-fix">+</div>`;

                if(cueType === 'center'){
                    cues += `<div class="ant-cue center">${star}</div>`;
                } else if(cueType === 'double'){
                    cues += `<div class="ant-cue top">${star}</div><div class="ant-cue bottom">${star}</div>`;
                } else if(cueType === 'spatial'){
                    cues += `<div class="ant-cue ${pos}">${star}</div>`;
                }
                return `<div class="ant-stage">${cues}</div>`
            },
            choices: "NO_KEYS",
            trial_duration: CUE_DURATION,
            data: { task: 'cue' }
        };

        //3. post-cue fixation
        const fixation2 = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<div class="ant-stage"><div class="ant-fix">+</div></div>`,
            choices: "NO_KEYS",
            trial_duration: 400,
            data: {task:'fixation2'}
        };

        //4. target - until response
        const target = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function(){
                const dir = jsPsych.evaluateTimelineVariable('direction');
                const cong = jsPsych.evaluateTimelineVariable('congruency');
                const pos = jsPsych.evaluateTimelineVariable('position');
                return `<div class="ant-stage">
                            <div class="ant-fix">+</div>
                            <div class="ant-target ${pos}">${targetRow(dir, cong)}</div>
                        </div>`;
            },
            choices: [KEY_LEFT, KEY_RIGHT],
            trial_duration: 1700,
            response_ends_trial: true,
            data: {
                task: 'response',
                cue: jsPsych.timelineVariable('cue'),
                congruency: jsPsych.timelineVariable('congruency'),
                direction: jsPsych.timelineVariable('direction'),
                position: jsPsych.timelineVariable('position')
            },
            on_finish: function(data){
                const expected = (data.direction === 'left') ? KEY_LEFT:KEY_RIGHT;
                data.correct = jsPsych.pluginAPI.compareKeys(data.response, expected);
            }
        };


        // making blocks
        function makeBlock(reps){
            return{
                timeline: [fixation1, cue, fixation2, target],
                timeline_variables: buildTrialList(reps)
            };
        }

        function betweenBlockInst(blockNum){
            return {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `
                <div class="instr">
                    <p>
                        <span class="hu">A(z) ${blockNum}. blokk vége. Pihenjen, ameddig szeretne.</span>
                        <span class="en">End of block ${blockNum}. Take a break for as long as you like.</span>
                    </p>
                    ${keyList}
                    <p class="go">
                        <span class="hu"><kbd>SPACE</kbd> — folytatás</span>
                        <span class="en"><kbd>SPACE</kbd> — continue</span>
                    </p>
                </div>`,
                choices: [' '],
                post_trial_gap: 500
            };
        }

        const REPS_PER_BLOCK = 1;
        const LENGTHS = { short:1, medium: 2, long: 4}; // blocks per duration

        ceChooseDuration().then(function (choice) {
            const N_BLOCKS = LENGTHS[choice];
            for (let b = 1; b <= N_BLOCKS; b++) {
                timeline.push(makeBlock(REPS_PER_BLOCK));
                if (b < N_BLOCKS) timeline.push(betweenBlockInst(b));
            }

            // "debriefing" == charted result screening
            timeline.push(ceResultsScreen(jsPsych,{
                compute: function(jp){
                    const en = (document.documentElement.lang === 'en');
                    const trials   = jp.data.get().filter({ task: 'response' });
                    const answered = trials.filterCustom(function (t) { return t.rt !== null; });
                    const correct  = trials.filter({ correct: true });
                    const wrong    = answered.count() - correct.count();
                    const missed   = trials.count() - answered.count();
                    const meanRt   = function (sel) { return Math.round(correct.filter(sel).select('rt').mean()) || 0; };

                    const rtNoCue      = meanRt({ cue: 'none'    });
                    const rtCenterCue  = meanRt({ cue: 'center'  });
                    const rtDoubleCue  = meanRt({ cue: 'double'  });
                    const rtSpatialCue = meanRt({ cue: 'spatial' });

                    const rows = [
                        { label_hu: 'Helyes válaszok', label_en: 'Correct responses',   value: correct.count() },
                        { label_hu: 'Hibás válaszok',  label_en: 'Incorrect responses', value: wrong }
                    ];
                    if (missed > 0) {
                        rows.push({ label_hu: 'Nem válaszolt', label_en: 'No response', value: missed });
                    }
                    rows.push({ label_hu: 'Átlagos reakcióidő', label_en: 'Mean reaction time',
                                value: (Math.round(correct.select('rt').mean()) || 0) + ' ms' });

                    return {
                        rows: rows,
                        /*chart: {
                            kind: 'bar',
                            title: en ? 'Reaction time by cue type' : 'Reakcióidő jelzéstípusonként',
                            bars: [
                                { label: en ? 'No cue'  : 'Nincs',    value: rtNoCue,      unit: 'ms' },
                                { label: en ? 'Center'  : 'Központi', value: rtCenterCue,  unit: 'ms' },
                                { label: en ? 'Double'  : 'Dupla',    value: rtDoubleCue,  unit: 'ms' },
                                { label: en ? 'Spatial' : 'Téri',     value: rtSpatialCue, unit: 'ms' }
                            ]
                        }*/
                    };
                }
            }));

            jsPsych.run(timeline);
        });

    </script>
    </body>
</html>
