<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Térbeli Kontextuális Előhívás (Spatial Contextual Cueing — CONSP)</title>

    <script src="https://unpkg.com/jspsych@8.2.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" />
    <script src="ce-duration.js"></script>
    <script src="ce-chart.js"></script>

    <style>
        /* jsPsych v8: .jspsych-content collapses to zero WIDTH inside the flex
           wrapper. Give it an explicit width and centre it. */
        html, body { min-height: 100vh; margin: 0; }
        .jspsych-display-element { width: 100%; min-height: 100vh; }
        .jspsych-content-wrapper { width: 100%; }
        .jspsych-content { width: 100%; max-width: 900px; margin: auto; }

        [lang="hu"] .en { display: none; }
        [lang="en"] .hu { display: none; }

        body {
            background: #FBF7EE;
            color: #1F1B16;
            font-family: "Public Sans", system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #181612; color: #E8E3D6; }
        }

        .fixation { font-size: 60px; line-height: 1; }

        /* search field */
        .consp-stage {
            position: relative;
            width: 640px;
            height: 480px;
            margin: 0 auto;
        }
        .consp-item {
            position: absolute;
            width: 34px;
            height: 34px;
            line-height: 34px;
            text-align: center;
            font-size: 30px;
            font-weight: 500;
            font-family: "DejaVu Sans Mono", "Menlo", monospace;
            color: #1F1B16;
            user-select: none;
        }
        @media (prefers-color-scheme: dark) {
            .consp-item { color: #E8E3D6; }
        }

        .instructions-text {
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.65;
            font-size: 18px;
        }
        .instructions-text p { margin: 0 0 1.2rem; }
        .instructions-text p:last-child { margin-bottom: 0; }

        .debrief-table { margin: 1.5rem auto; border-collapse: collapse; font-size: 18px; }
        .debrief-table td { padding: 6px 18px; border-bottom: 1px solid rgba(0,0,0,0.12); text-align: left; }
        .debrief-table td:last-child { text-align: right; font-weight: 600; }
    </style>
</head>
<body>
<script>
/* ------------------------------------------------------------------
   Spatial contextual cueing (Chun & Jiang, 1998)

   A single T hides among 11 rotated Ls. Half the displays use layouts
   that REPEAT unchanged in every block; half are generated fresh each
   block. Search gets faster on repeated layouts even though observers
   cannot report which ones repeated — implicit learning of spatial
   context.

   Critical detail: in a repeated layout the target LOCATION is fixed,
   but the target ORIENTATION is re-randomised on every presentation.
   Otherwise participants learn the motor response, not the context.
   ------------------------------------------------------------------ */

/* restore saved language */
try {
    const savedLang = localStorage.getItem('ce.lang');
    document.documentElement.lang = (savedLang === 'hu' || savedLang === 'en') ? savedLang : 'hu';
} catch (e) { document.documentElement.lang = 'hu'; }

/* ---- cog_site build 2026-08-14-c — CONSP ---- */
console.log('[cog_site] CONSP build 2026-08-14-c');

/* Stop SPACE and the arrow keys from scrolling the page mid-trial.
   preventDefault only — jsPsych's own listener still receives the event. */
window.addEventListener('keydown', function (e) {
    if ([' ', 'Spacebar', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) !== -1) {
        e.preventDefault();
    }
}, { passive: false });


/* response keys */
const KEY_LEFT  = 'a';   // target tilted left
const KEY_RIGHT = 'l';   // target tilted right

const jsPsych = initJsPsych();
const timeline = [];

/* ---- geometry ---------------------------------------------------- */
const COLS = 8, ROWS = 6;
const CELL_W = 80, CELL_H = 80;
const JITTER = 12;               // px of random offset inside a cell
const N_ITEMS = 12;              // 1 target + 11 distractors

function cellCount() { return COLS * ROWS; }

/* pick n distinct cell indices */
function pickCells(n) {
    const all = [];
    for (let i = 0; i < cellCount(); i++) all.push(i);
    return jsPsych.randomization.shuffle(all).slice(0, n);
}

function cellToXY(idx) {
    const c = idx % COLS, r = Math.floor(idx / COLS);
    return {
        x: c * CELL_W + (CELL_W - 34) / 2 + (Math.random() * 2 - 1) * JITTER,
        y: r * CELL_H + (CELL_H - 34) / 2 + (Math.random() * 2 - 1) * JITTER
    };
}

/* ---- layouts ------------------------------------------------------
   A layout fixes: the target's cell, and the distractors' cells +
   rotations. Target orientation is NOT part of the layout.            */
function makeLayout() {
    const cells = pickCells(N_ITEMS);
    const distractorRots = [];
    for (let i = 1; i < N_ITEMS; i++) {
        distractorRots.push(jsPsych.randomization.sampleWithReplacement([0, 90, 180, 270], 1)[0]);
    }
    return {
        targetCell: cells[0],
        distractorCells: cells.slice(1),
        distractorRots: distractorRots
    };
}

/* ---- rendering ---------------------------------------------------- */
function renderDisplay(layout, targetTilt) {
    /* 90 = tilted right, 270 = tilted left */
    let html = '<div class="consp-stage">';

    const t = cellToXY(layout.targetCell);
    html += `<div class="consp-item" style="left:${t.x}px;top:${t.y}px;` +
            `transform:rotate(${targetTilt}deg);">T</div>`;

    layout.distractorCells.forEach(function (cell, i) {
        const p = cellToXY(cell);
        html += `<div class="consp-item" style="left:${p.x}px;top:${p.y}px;` +
                `transform:rotate(${layout.distractorRots[i]}deg);">L</div>`;
    });

    return html + '</div>';
}

/* ---- repeated vs novel sets --------------------------------------- */
const N_REPEATED = 6;            // repeated layouts, reused every block
const N_NOVEL    = 6;            // fresh layouts each block
const repeatedLayouts = [];
for (let i = 0; i < N_REPEATED; i++) repeatedLayouts.push(makeLayout());

/* module-level bridge: on_start writes here, on_finish reads it,
   because jsPsych v8 evaluates `data` before on_start runs. */
let pendingTilt = 90;

function buildBlockList(blockNum) {
    const list = [];
    repeatedLayouts.forEach(function (lay, i) {
        list.push({ layout: lay, condition: 'repeated', epoch: blockNum, layout_id: 'R' + i });
    });
    for (let i = 0; i < N_NOVEL; i++) {
        list.push({ layout: makeLayout(), condition: 'novel', epoch: blockNum, layout_id: 'N' + blockNum + '_' + i });
    }
    return jsPsych.randomization.shuffle(list);
}

/* ---- trial components --------------------------------------------- */
const fixation = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="fixation">+</div>',
    choices: "NO_KEYS",
    trial_duration: 500,
    data: { task: 'fixation' }
};

const search = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function () {
        const layout = jsPsych.evaluateTimelineVariable('layout');
        return renderDisplay(layout, pendingTilt);
    },
    choices: [KEY_LEFT, KEY_RIGHT],
    trial_duration: 5000,
    data: {
        task:      'response',
        condition: jsPsych.timelineVariable('condition'),
        epoch:     jsPsych.timelineVariable('epoch'),
        layout_id: jsPsych.timelineVariable('layout_id')
    },
    on_start: function () {
        /* re-randomise target orientation on EVERY presentation */
        pendingTilt = jsPsych.randomization.sampleWithReplacement([90, 270], 1)[0];
    },
    on_finish: function (data) {
        data.tilt = pendingTilt;
        const expected = (pendingTilt === 270) ? KEY_LEFT : KEY_RIGHT;
        data.correct = jsPsych.pluginAPI.compareKeys(data.response, expected);
    },
    post_trial_gap: 300
};

function makeBlock(blockNum) {
    return { timeline: [fixation, search], timeline_variables: buildBlockList(blockNum) };
}

function betweenBlockInst(blockNum) {
    return {
        type: jsPsychHtmlKeyboardResponse,
        choices: [' '],
        stimulus: `<div class="instructions-text"><p>
            <span class="hu">A(z) ${blockNum}. blokk vége. Nyomja meg a SPACE gombot a folytatáshoz.</span>
            <span class="en">End of block ${blockNum}. Press SPACE to continue.</span>
        </p></div>`,
        post_trial_gap: 500
    };
}

/* ---- instructions -------------------------------------------------- */
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    choices: [' '],
    stimulus: `
    <div class="instructions-text">
        <p>
        <span class="hu">A keresési mezőben egyetlen <strong>T</strong> betű rejtőzik sok <strong>L</strong> betű között.
            Keresse meg a T-t, és döntse el, merre dől:
            ha jobbra dől, nyomja meg az <strong>L</strong> gombot; ha balra, az <strong>A</strong> gombot.
            Válaszoljon minél gyorsabban és pontosabban! A SPACE gombbal kezdhet.</span>
        <span class="en">A single <strong>T</strong> is hidden among many <strong>L</strong>s in the search field.
            Find the T and decide which way it is tilted:
            tilted right &rarr; press <strong>L</strong>; tilted left &rarr; press <strong>A</strong>.
            Respond as quickly and accurately as possible! Press SPACE to start.</span>
        </p>
    </div>`,
    post_trial_gap: 500
});

/* Block = 12 trials, ~2.9 s/trial => ~35 s/block. */
const LENGTHS = { short: 5, medium: 9, long: 17 };
let N_BLOCKS = LENGTHS.medium;

ceChooseDuration().then(function (choice) {
    N_BLOCKS = LENGTHS[choice] || LENGTHS.medium;

    for (let b = 1; b <= N_BLOCKS; b++) {
        timeline.push(makeBlock(b));
        if (b < N_BLOCKS) timeline.push(betweenBlockInst(b));
    }

    timeline.push(ceResultsScreen(jsPsych, {
        compute: function (jp) {
            const en = (document.documentElement.lang === 'en');
            const trials   = jp.data.get().filter({ task: 'response' });
            const answered = trials.filterCustom(function (t) { return t.rt !== null; });
            const correct  = trials.filter({ correct: true });
            const wrong    = answered.count() - correct.count();
            const missed   = trials.count() - answered.count();

            const rtRepeated = Math.round(correct.filter({ condition: 'repeated' }).select('rt').mean()) || 0;
            const rtNovel    = Math.round(correct.filter({ condition: 'novel'    }).select('rt').mean()) || 0;

            /* per-block mean RT for each condition */
            const repPts = [], novPts = [];
            for (let b = 1; b <= N_BLOCKS; b++) {
                const cb  = correct.filter({ epoch: b });
                const rep = Math.round(cb.filter({ condition: 'repeated' }).select('rt').mean()) || 0;
                const nov = Math.round(cb.filter({ condition: 'novel'    }).select('rt').mean()) || 0;
                if (rep) repPts.push({ x: b, y: rep });
                if (nov) novPts.push({ x: b, y: nov });
            }

                    const rows = [
                        { label_hu: 'Helyes válaszok', label_en: 'Correct responses',   value: correct.count() },
                        { label_hu: 'Hibás válaszok',  label_en: 'Incorrect responses', value: wrong }
                    ];
                    if (missed > 0) {
                        rows.push({ label_hu: 'Nem válaszolt', label_en: 'No response', value: missed });
                    }
            rows.push({ label_hu: 'Átlagos reakcióidő', label_en: 'Mean reaction time',
                        value: (Math.round(correct.select('rt').mean()) || 0) + ' ms' });
            rows.push({ label_hu: 'Reakcióidő — ismételt', label_en: 'RT — repeated', value: rtRepeated + ' ms' });
            rows.push({ label_hu: 'Reakcióidő — új',       label_en: 'RT — novel',    value: rtNovel + ' ms' });

            return {
                rows: rows,
                chart: {
                    kind: 'line',
                    title: en ? 'Reaction time by block' : 'Reakcióidő blokkonként',
                    xLabel: en ? 'Block' : 'Blokk',
                    series: [
                        { label: en ? 'Repeated' : 'Ismételt', points: repPts },
                        { label: en ? 'Novel'    : 'Új',       points: novPts }
                    ]
                }
            };
        }
    }));

    jsPsych.run(timeline);
});
</script>
</body>
</html>
