<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Térbeli Kontextuális Előhívás (Spatial Contextual Cueing — CONSP)</title>

    <script src="https://unpkg.com/jspsych@8.2.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" />
    <script src="ce-duration.js"></script>
    <script src="ce-chart.js"></script>

    <style>
        /* jsPsych v8: .jspsych-content collapses to zero WIDTH inside the flex
           wrapper. Give it an explicit width and centre it. */
        html, body { min-height: 100vh; margin: 0; }
        .jspsych-display-element { width: 100%; min-height: 100vh; }
        .jspsych-content-wrapper { width: 100%; }
        .jspsych-content { width: 100%; max-width: 900px; margin: auto; }

        [lang="hu"] .en { display: none; }
        [lang="en"] .hu { display: none; }

        body {
            background: #FBF7EE;
            color: #1F1B16;
            font-family: "Public Sans", system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #181612; color: #E8E3D6; }
        }

        .fixation { font-size: 60px; line-height: 1; }

        /* search field
           Reduced from 640x480 to 480x360 so the whole array falls inside a
           narrower viewing angle and can be scanned without moving the head.
           Keep .consp-stage in sync with COLS/ROWS/CELL_* in the script. */
        .consp-stage {
            position: relative;
            width: 480px;
            height: 360px;
            margin: 0 auto;
        }
        .consp-item {
            position: absolute;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            font-size: 24px;
            font-weight: 500;
            font-family: "DejaVu Sans Mono", "Menlo", monospace;
            color: #1F1B16;
            user-select: none;
        }
        @media (prefers-color-scheme: dark) {
            .consp-item { color: #E8E3D6; }
        }

        /* instruction screens */
        .instr {
            max-width: 620px;
            margin: 0 auto;
            text-align: left;
            line-height: 1.6;
            font-size: 17px;
        }
        .instr h2 {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 1.1rem;
            text-align: center;
        }
        .instr p { margin: 0 0 1rem; }
        .instr .hint { font-size: 14.5px; opacity: 0.68; }
        .instr .go { text-align: center; font-size: 14.5px; opacity: 0.68; margin-bottom: 0; }

        kbd {
            font-family: inherit;
            font-size: 0.92em;
            font-weight: 600;
            padding: 0.12em 0.5em;
            border: 1px solid rgba(31,27,22,0.28);
            border-bottom-width: 2px;
            border-radius: 5px;
            background: rgba(31,27,22,0.05);
            white-space: nowrap;
        }
        @media (prefers-color-scheme: dark) {
            kbd { border-color: rgba(232,227,214,0.30); background: rgba(232,227,214,0.07); }
        }

        /* miniature of the search field, shown with the instructions */
        .mini-field {
            position: relative;
            width: 240px;
            height: 150px;
            margin: 0 auto 1.2rem;
            border: 1px solid rgba(31,27,22,0.18);
            border-radius: 6px;
            background: rgba(31,27,22,0.02);
        }
        @media (prefers-color-scheme: dark) {
            .mini-field { border-color: rgba(232,227,214,0.20); background: rgba(232,227,214,0.03); }
        }
        .mini-field .consp-item { width: 20px; height: 20px; line-height: 20px; font-size: 17px; }
        .mini-field .consp-item.target { color: #7A2B27; }
        @media (prefers-color-scheme: dark) {
            .mini-field .consp-item.target { color: #E0A24A; }
        }
        .mini-cap { text-align: center; font-size: 12.5px; opacity: 0.7; margin: -0.8rem 0 1.2rem; }

        /* tilt key legend */
        .tilts {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin: 0 0 1.2rem;
            padding: 0.9rem 0;
            border-top: 1px solid rgba(122,43,39,0.18);
            border-bottom: 1px solid rgba(122,43,39,0.18);
        }
        @media (prefers-color-scheme: dark) {
            .tilts { border-color: rgba(224,162,74,0.28); }
        }
        .tilt { text-align: center; }
        .tilt .glyph {
            display: block;
            width: 40px; height: 40px; line-height: 40px;
            margin: 0 auto 0.45rem;
            font-family: "DejaVu Sans Mono", "Menlo", monospace;
            font-size: 30px; font-weight: 500;
        }
        .tilt .label { display: block; font-size: 13.5px; opacity: 0.7; margin-top: 0.35rem; }

        .debrief-table { margin: 1.5rem auto; border-collapse: collapse; font-size: 18px; }
        .debrief-table td { padding: 6px 18px; border-bottom: 1px solid rgba(0,0,0,0.12); text-align: left; }
        .debrief-table td:last-child { text-align: right; font-weight: 600; }
    </style>
</head>
<body>
<script>

/* restore saved language */
try {
    const savedLang = localStorage.getItem('ce.lang');
    document.documentElement.lang = (savedLang === 'hu' || savedLang === 'en') ? savedLang : 'hu';
} catch (e) { document.documentElement.lang = 'hu'; }

/* cog_site build 2026-09-02-a — CONSP */
/*
console.log('[cog_site] CONSP build 2026-09-02-a');
*/

/* Stop SPACE and the arrow keys from scrolling the page mid-trial.
   preventDefault only — jsPsych's own listener still receives the event. */
window.addEventListener('keydown', function (e) {
    if ([' ', 'Spacebar', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) !== -1) {
        e.preventDefault();
    }
}, { passive: false });


/* response keys */
const KEY_LEFT  = 'a';   // target tilted left
const KEY_RIGHT = 'l';   // target tilted right

const jsPsych = initJsPsych();
const timeline = [];

/* geometry — keep in sync with .consp-stage / .consp-item in the CSS */
const COLS = 8, ROWS = 6;
const CELL_W = 60, CELL_H = 60;  // 8x60 = 480 wide, 6x60 = 360 tall
const ITEM   = 28;               // item box size, matches .consp-item
const JITTER = 8;                // px of random offset inside a cell
const N_ITEMS = 12;              // 1 target + 11 distractors

function cellCount() { return COLS * ROWS; }

/* pick n distinct cell indices */
function pickCells(n) {
    const all = [];
    for (let i = 0; i < cellCount(); i++) all.push(i);
    return jsPsych.randomization.shuffle(all).slice(0, n);
}

/* Resolve a cell index to pixel coordinates ONCE, at layout-creation time.
   Previously this ran on every render, so a "repeated" layout jittered to
   slightly different pixels each presentation — the configuration was no
   longer literally identical, which is what contextual cueing depends on. */
function cellToXY(idx) {
    const c = idx % COLS, r = Math.floor(idx / COLS);
    return {
        x: c * CELL_W + (CELL_W - ITEM) / 2 + (Math.random() * 2 - 1) * JITTER,
        y: r * CELL_H + (CELL_H - ITEM) / 2 + (Math.random() * 2 - 1) * JITTER
    };
}

/* layouts — positions and distractor orientations are frozen here */
function makeLayout() {
    const cells = pickCells(N_ITEMS);
    const positions = cells.map(cellToXY);
    const distractorRots = [];
    for (let i = 1; i < N_ITEMS; i++) {
        distractorRots.push(jsPsych.randomization.sampleWithReplacement([0, 90, 180, 270], 1)[0]);
    }
    return {
        targetPos: positions[0],
        distractorPos: positions.slice(1),
        distractorRots: distractorRots
    };
}

/* rendering */
function renderDisplay(layout, targetTilt) {
    /* 90 = tilted right, 270 = tilted left */
    let html = '<div class="consp-stage">';

    const t = layout.targetPos;
    html += `<div class="consp-item" style="left:${t.x.toFixed(1)}px;top:${t.y.toFixed(1)}px;` +
            `transform:rotate(${targetTilt}deg);">T</div>`;

    layout.distractorPos.forEach(function (p, i) {
        html += `<div class="consp-item" style="left:${p.x.toFixed(1)}px;top:${p.y.toFixed(1)}px;` +
                `transform:rotate(${layout.distractorRots[i]}deg);">L</div>`;
    });

    return html + '</div>';
}

/* repeated vs novel sets */
const N_REPEATED = 6;            // repeated layouts, reused every block
const N_NOVEL    = 6;            // fresh layouts each block
const repeatedLayouts = [];
for (let i = 0; i < N_REPEATED; i++) repeatedLayouts.push(makeLayout());

/* module-level bridge: on_start writes here, on_finish reads it,
   because jsPsych v8 evaluates `data` before on_start runs. */
let pendingTilt = 90;

function buildBlockList(blockNum) {
    const list = [];
    repeatedLayouts.forEach(function (lay, i) {
        list.push({ layout: lay, condition: 'repeated', epoch: blockNum, layout_id: 'R' + i });
    });
    for (let i = 0; i < N_NOVEL; i++) {
        list.push({ layout: makeLayout(), condition: 'novel', epoch: blockNum, layout_id: 'N' + blockNum + '_' + i });
    }
    return jsPsych.randomization.shuffle(list);
}

/* trial components */
const fixation = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="fixation">+</div>',
    choices: "NO_KEYS",
    trial_duration: 500,
    data: { task: 'fixation' }
};

const search = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function () {
        const layout = jsPsych.evaluateTimelineVariable('layout');
        return renderDisplay(layout, pendingTilt);
    },
    choices: [KEY_LEFT, KEY_RIGHT],
    trial_duration: 5000,
    response_ends_trial: true,
    data: {
        task:      'response',
        condition: jsPsych.timelineVariable('condition'),
        epoch:     jsPsych.timelineVariable('epoch'),
        layout_id: jsPsych.timelineVariable('layout_id')
    },
    on_start: function () {
        /* re-randomise target orientation on EVERY presentation */
        pendingTilt = jsPsych.randomization.sampleWithReplacement([90, 270], 1)[0];
    },
    on_finish: function (data) {
        data.tilt = pendingTilt;
        const expected = (pendingTilt === 270) ? KEY_LEFT : KEY_RIGHT;
        data.correct = jsPsych.pluginAPI.compareKeys(data.response, expected);
    },
    post_trial_gap: 300
};

function makeBlock(blockNum) {
    return { timeline: [fixation, search], timeline_variables: buildBlockList(blockNum) };
}

/* instruction content */

/* A small hand-placed sample of the array: one T among Ls. */
const miniField = (function () {
    const items = [
        { x:  16, y:  14, rot: 180, ch: 'L' },
        { x:  92, y:  22, rot:  90, ch: 'L' },
        { x: 178, y:  10, rot: 270, ch: 'L' },
        { x:  46, y:  62, rot:   0, ch: 'L' },
        { x: 128, y:  70, rot:  90, ch: 'T' },   /* the target, tilted right */
        { x: 206, y:  58, rot: 180, ch: 'L' },
        { x:  20, y: 112, rot:  90, ch: 'L' },
        { x: 100, y: 118, rot: 270, ch: 'L' },
        { x: 186, y: 108, rot:   0, ch: 'L' }
    ];
    let html = '<div class="mini-field">';
    items.forEach(function (it) {
        const cls = (it.ch === 'T') ? 'consp-item target' : 'consp-item';
        html += `<div class="${cls}" style="left:${it.x}px;top:${it.y}px;` +
                `transform:rotate(${it.rot}deg);">${it.ch}</div>`;
    });
    return html + '</div>';
})();

const tiltLegend = `
<div class="tilts">
    <div class="tilt">
        <span class="glyph" style="transform:rotate(270deg);">T</span>
        <span class="label"><span class="hu">balra dől</span><span class="en">tilted left</span></span>
        <kbd>A</kbd>
    </div>
    <div class="tilt">
        <span class="glyph" style="transform:rotate(90deg);">T</span>
        <span class="label"><span class="hu">jobbra dől</span><span class="en">tilted right</span></span>
        <kbd>L</kbd>
    </div>
</div>`;

const taskBrief = `
${miniField}
<p class="mini-cap"><span class="hu">Egy T rejtőzik a sok L között</span><span class="en">One T is hidden among the Ls</span></p>
<p>
    <span class="hu">Keresse meg a <strong>T</strong> betűt, és döntse el, melyik irányba dől.</span>
    <span class="en">Find the <strong>T</strong> and decide which way it is tilted.</span>
</p>
${tiltLegend}`;

/* instructions — first screen */
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    choices: [' '],
    stimulus: `
    <div class="instr">
        <h2><span class="hu">Vizuális keresés</span><span class="en">Visual search</span></h2>
        ${taskBrief}
        <p class="hint">
            <span class="hu">A T iránya minden megjelenésnél változhat, ezért nézze meg minden alkalommal.
                Válaszoljon minél gyorsabban és pontosabban.</span>
            <span class="en">The tilt of the T can change every time it appears, so check it on every trial.
                Respond as quickly and accurately as you can.</span>
        </p>
        <p class="go">
            <span class="hu"><kbd>SPACE</kbd> — indítás</span>
            <span class="en"><kbd>SPACE</kbd> — start</span>
        </p>
    </div>`,
    post_trial_gap: 500
});

/* between blocks: the same brief again, so the rule is never more than one
   block away from being restated */
function betweenBlockInst(blockNum) {
    return {
        type: jsPsychHtmlKeyboardResponse,
        choices: [' '],
        stimulus: `
        <div class="instr">
            <p>
                <span class="hu">A(z) ${blockNum}. blokk vége. Pihenjen, ameddig szeretne.</span>
                <span class="en">End of block ${blockNum}. Take a break for as long as you like.</span>
            </p>
            ${taskBrief}
            <p class="go">
                <span class="hu"><kbd>SPACE</kbd> — folytatás</span>
                <span class="en"><kbd>SPACE</kbd> — continue</span>
            </p>
        </div>`,
        post_trial_gap: 500
    };
}

/* Block = 12 trials, ~2.9 s/trial => ~35 s/block. */
const LENGTHS = { short: 5, medium: 9, long: 17 };
let N_BLOCKS = LENGTHS.medium;

ceChooseDuration().then(function (choice) {
    N_BLOCKS = LENGTHS[choice] || LENGTHS.medium;

    for (let b = 1; b <= N_BLOCKS; b++) {
        timeline.push(makeBlock(b));
        if (b < N_BLOCKS) timeline.push(betweenBlockInst(b));
    }

    timeline.push(ceResultsScreen(jsPsych, {
        compute: function (jp) {
            const en = (document.documentElement.lang === 'en');
            const trials   = jp.data.get().filter({ task: 'response' });
            const answered = trials.filterCustom(function (t) { return t.rt !== null; });
            const correct  = trials.filter({ correct: true });
            const wrong    = answered.count() - correct.count();
            const missed   = trials.count() - answered.count();

            const rtRepeated = Math.round(correct.filter({ condition: 'repeated' }).select('rt').mean()) || 0;
            const rtNovel    = Math.round(correct.filter({ condition: 'novel'    }).select('rt').mean()) || 0;

            /* per-block mean RT for each condition */
            const repPts = [], novPts = [];
            for (let b = 1; b <= N_BLOCKS; b++) {
                const cb  = correct.filter({ epoch: b });
                const rep = Math.round(cb.filter({ condition: 'repeated' }).select('rt').mean()) || 0;
                const nov = Math.round(cb.filter({ condition: 'novel'    }).select('rt').mean()) || 0;
                if (rep) repPts.push({ x: b, y: rep });
                if (nov) novPts.push({ x: b, y: nov });
            }

            const rows = [
                { label_hu: 'Helyes válaszok', label_en: 'Correct responses',   value: correct.count() },
                { label_hu: 'Hibás válaszok',  label_en: 'Incorrect responses', value: wrong }
            ];
            if (missed > 0) {
                rows.push({ label_hu: 'Nem válaszolt', label_en: 'No response', value: missed });
            }
            rows.push({ label_hu: 'Átlagos reakcióidő', label_en: 'Mean reaction time',
                        value: (Math.round(correct.select('rt').mean()) || 0) + ' ms' });
            rows.push({ label_hu: 'Reakcióidő — ismételt', label_en: 'RT — repeated', value: rtRepeated + ' ms' });
            rows.push({ label_hu: 'Reakcióidő — új',       label_en: 'RT — novel',    value: rtNovel + ' ms' });

            return {
                rows: rows,
                chart: {
                    kind: 'line',
                    title: en ? 'Reaction time by block' : 'Reakcióidő blokkonként',
                    xLabel: en ? 'Block' : 'Blokk',
                    series: [
                        { label: en ? 'Repeated' : 'Ismételt', points: repPts },
                        { label: en ? 'Novel'    : 'Új',       points: novPts }
                    ]
                }
            };
        }
    }));

    jsPsych.run(timeline);
});
</script>
</body>
</html>
